# Example source registry. Copy this file to config/feeds.toml for local use.

[issue]
max_candidates_to_triage = 250
max_papers_to_full_review = 20
max_short_mentions = 8
max_deep_dive_drafts = 3
max_total_cost_usd = 10.00
force_include = []
force_exclude = []

[model_policy]
provider = "fake"
triage_model = "fake-triage-v1"
review_model = "fake-review-v1"
prompt_version = "dev"
# For local evaluation-only real-provider experiments, copy this file to the
# ignored config/feeds.toml and set:
# provider = "openai"
# triage_model = "gpt-5.5"
# review_model = "gpt-5.5"
# Keep the fake provider as the committed default until the provider gate passes.

[[sources]]
id = "nep-for"
name = "NEP Forecasting"
type = "rss"
url = "https://nep.repec.org/rss/nep-for.rss.xml"
domain = "economics"
priority = "high"
lookback_days = 30

[[sources]]
id = "arxiv-qfin-st"
name = "arXiv Quantitative Finance Statistical Methods"
type = "rss"
url = "http://export.arxiv.org/rss/q-fin.ST"
domain = "finance"
priority = "medium"
lookback_days = 30

[[sources]]
id = "federal-reserve-working-papers"
name = "Federal Reserve Working Papers"
type = "rss"
url = "https://www.federalreserve.gov/feeds/working_papers.xml"
domain = "central-bank-research"
priority = "high"
lookback_days = 30
