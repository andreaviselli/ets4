[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ets4"
version = "0.1.0"
description = "Editorial review tooling for economic time-series forecasting research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "openai>=1.0",
    "python-dateutil>=2.8",
    "requests>=2.31",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
deepdive = [
    "markdown>=3.5",
    "pymupdf>=1.23",
    "python-dotenv>=1.0",
    "weasyprint>=60",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
ets4 = "ets4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
